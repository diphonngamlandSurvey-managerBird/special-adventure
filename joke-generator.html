<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Joke Generator</title>
    <style>
      :root {
        --bg: #f5f3ff;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #7c3aed;
        --primary-dark: #5b21b6;
        --accent: #fbbf24;
        --border: #e5e7eb;
        --shadow: 0 18px 40px rgba(124, 58, 237, 0.15);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #f5f3ff 0%, #eef2ff 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .app {
        width: min(100%, 760px);
        background: var(--card);
        border-radius: 22px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 6vw, 2.8rem);
        text-align: center;
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        margin: 0 0 24px;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }

      select,
      button {
        border-radius: 12px;
        border: none;
        font-size: 1rem;
      }

      select {
        padding: 12px 14px;
        border: 1px solid var(--border);
        background: #fafafa;
        color: var(--text);
      }

      button {
        background: var(--primary);
        color: white;
        padding: 12px 18px;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        background: var(--primary-dark);
      }

      .joke-card {
        background: linear-gradient(135deg, #faf5ff 0%, #f8fafc 100%);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
        min-height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .joke {
        font-size: clamp(1.15rem, 2vw, 1.5rem);
        line-height: 1.7;
        white-space: pre-line;
      }

      .loading {
        color: var(--muted);
        font-style: italic;
      }

      .error {
        color: #b91c1c;
      }

      @media (max-width: 640px) {
        .app { padding: 20px 16px; }
        .controls { flex-direction: column; }
        select, button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Joke Generator</h1>
      <p class="subtitle">A fresh joke from an external API, every time.</p>

      <div class="controls">
        <select id="category-select" aria-label="Select joke category">
          <option value="Any">Any</option>
          <option value="Programming">Programming</option>
          <option value="Misc">Misc</option>
          <option value="Dark">Dark</option>
          <option value="Pun">Pun</option>
          <option value="Spooky">Spooky</option>
        </select>
        <button id="generate-btn" type="button">Get Another Joke</button>
      </div>

      <div class="joke-card">
        <div id="joke-output" class="joke loading">Loading a joke...</div>
      </div>
    </div>

    <script>
      const jokeOutput = document.getElementById('joke-output');
      const generateBtn = document.getElementById('generate-btn');
      const categorySelect = document.getElementById('category-select');

      async function fetchJoke(category = 'Any') {
        jokeOutput.textContent = 'Loading a joke...';
        jokeOutput.className = 'joke loading';

        try {
          const response = await fetch(`https://v2.jokeapi.dev/joke/${encodeURIComponent(category)}?type=single`);
          if (!response.ok) {
            throw new Error('Failed to fetch joke');
          }

          const data = await response.json();

          if (data.error) {
            throw new Error(data.message || 'Could not load a joke');
          }

          jokeOutput.textContent = data.joke || 'No joke found. Try again!';
          jokeOutput.className = 'joke';
        } catch (error) {
          jokeOutput.textContent = 'Oops! The joke API is not available right now. Please try again.';
          jokeOutput.className = 'joke error';
          console.error(error);
        }
      }

      generateBtn.addEventListener('click', () => {
        fetchJoke(categorySelect.value);
      });

      categorySelect.addEventListener('change', () => {
        fetchJoke(categorySelect.value);
      });

      fetchJoke();
    </script>
  </body>
</html>
