<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List App</title>
    <style>
      :root {
        --bg: #f3f6ff;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --danger: #ef4444;
        --border: #e5e7eb;
        --shadow: 0 20px 50px rgba(79, 70, 229, 0.14);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        padding: 24px;
      }

      .app {
        width: min(100%, 760px);
        background: var(--card);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 5vw, 2.6rem);
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
      }

      .todo-form {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
      }

      .todo-input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f9fafb;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .todo-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
      }

      .add-btn,
      .delete-btn,
      .toggle-btn,
      .clear-btn,
      .filter-btn {
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
      }

      .add-btn {
        background: var(--primary);
        color: #fff;
        padding: 0 20px;
        font-weight: 700;
      }

      .add-btn:hover,
      .delete-btn:hover,
      .toggle-btn:hover,
      .clear-btn:hover,
      .filter-btn:hover {
        transform: translateY(-1px);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter-btn {
        background: #eef2ff;
        color: var(--primary-dark);
        padding: 8px 12px;
        font-weight: 600;
      }

      .filter-btn.active {
        background: var(--primary);
        color: #fff;
      }

      .clear-btn {
        background: #fef2f2;
        color: var(--danger);
        padding: 10px 14px;
        font-weight: 600;
      }

      .tasks {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .task {
        background: #f9fafb;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .task-main {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
      }

      .task-text {
        flex: 1;
        word-break: break-word;
        line-height: 1.4;
      }

      .task.completed .task-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      .task-meta {
        color: var(--muted);
        font-size: 0.72rem;
        margin-top: 4px;
      }

      .toggle-btn {
        width: 40px;
        height: 40px;
        background: #e0f2fe;
        color: #0369a1;
        font-weight: 700;
        font-size: 1rem;
      }

      .task.completed .toggle-btn {
        background: #dcfce7;
        color: #166534;
      }

      .delete-btn {
        width: 38px;
        height: 38px;
        background: #fee2e2;
        color: var(--danger);
        font-weight: 700;
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        background: #fafafa;
        border: 1px dashed var(--border);
        border-radius: 16px;
        padding: 30px 16px;
      }

      @media (max-width: 640px) {
        .app { padding: 20px 16px; }
        .todo-form { flex-direction: column; }
        .add-btn { padding: 14px 16px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Todo List</h1>
      <p class="subtitle">Keep track of your tasks with browser local storage.</p>

      <form id="todo-form" class="todo-form">
        <input id="todo-input" class="todo-input" type="text" placeholder="Add a new task..." maxlength="200" aria-label="Add a new task" />
        <button type="submit" class="add-btn">Add</button>
      </form>

      <div class="toolbar">
        <div class="filters" aria-label="Task filters">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>

        <button id="clear-completed" class="clear-btn" type="button">Clear completed</button>
      </div>

      <ul id="task-list" class="tasks" aria-live="polite"></ul>
    </div>

    <script>
      const STORAGE_KEY = 'todo-list-items-v1';
      const filters = {
        all: () => true,
        active: (task) => !task.completed,
        completed: (task) => task.completed,
      };

      const form = document.getElementById('todo-form');
      const input = document.getElementById('todo-input');
      const taskList = document.getElementById('task-list');
      const clearCompletedBtn = document.getElementById('clear-completed');
      const filterButtons = [...document.querySelectorAll('.filter-btn')];

      let tasks = loadTasks();
      let activeFilter = 'all';

      function loadTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(saved) ? saved : [];
        } catch {
          return [];
        }
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function formatDate(dateString) {
        const date = new Date(dateString);
        return new Intl.DateTimeFormat(undefined, {
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        }).format(date);
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderTasks() {
        const visibleTasks = tasks.filter(filters[activeFilter] || filters.all);

        if (visibleTasks.length === 0) {
          taskList.innerHTML = `
            <li class="empty-state">
              ${tasks.length === 0 ? 'No tasks yet. Add one to get started!' : 'No tasks match the current filter.'}
            </li>
          `;
          return;
        }

        taskList.innerHTML = visibleTasks.map((task) => `
          <li class="task ${task.completed ? 'completed' : ''}" data-id="${task.id}">
            <div class="task-main">
              <button class="toggle-btn" type="button" aria-label="Toggle task status" data-action="toggle" data-id="${task.id}">
                ${task.completed ? '✓' : ''}
              </button>

              <div class="task-text">
                ${escapeHtml(task.text)}
                <div class="task-meta">Created ${formatDate(task.createdAt)}</div>
              </div>
            </div>

            <button class="delete-btn" type="button" aria-label="Delete task" data-action="delete" data-id="${task.id}">
              ×
            </button>
          </li>
        `).join('');
      }

      function addTask(text) {
        const trimmed = text.trim();
        if (!trimmed) {
          input.focus();
          return;
        }

        tasks.unshift({
          id: crypto.randomUUID(),
          text: trimmed,
          completed: false,
          createdAt: new Date().toISOString()
        });

        saveTasks();
        renderTasks();
        input.value = '';
        input.focus();
      }

      function toggleTask(id) {
        tasks = tasks.map((task) =>
          task.id === id ? { ...task, completed: !task.completed } : task
        );
        saveTasks();
        renderTasks();
      }

      function deleteTask(id) {
        tasks = tasks.filter((task) => task.id !== id);
        saveTasks();
        renderTasks();
      }

      function clearCompleted() {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        renderTasks();
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        addTask(input.value);
      });

      taskList.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        const { action, id } = button.dataset;
        if (!id) return;

        if (action === 'toggle') toggleTask(id);
        if (action === 'delete') deleteTask(id);
      });

      clearCompletedBtn.addEventListener('click', clearCompleted);

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          activeFilter = button.dataset.filter;
          filterButtons.forEach((btn) => btn.classList.toggle('active', btn === button));
          renderTasks();
        });
      });

      renderTasks();
    </script>
  </body>
</html>
