<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List App</title>
    <style>
      :root {
        --bg: #f3f6ff;
        --card: #ffffff;
        --card-alt: #f9fafb;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --danger: #ef4444;
        --warning: #f59e0b;
        --success: #10b981;
        --border: #e5e7eb;
        --shadow: 0 20px 50px rgba(79, 70, 229, 0.14);
      }

      body.dark {
        --bg: #111827;
        --card: #1f2937;
        --card-alt: #111827;
        --text: #f9fafb;
        --muted: #9ca3af;
        --primary: #818cf8;
        --primary-dark: #6366f1;
        --danger: #fca5a5;
        --warning: #fbbf24;
        --success: #34d399;
        --border: #374151;
        --shadow: 0 22px 50px rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        padding: 24px;
        transition: background 0.2s ease, color 0.2s ease;
      }

      body.dark {
        background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
      }

      .app {
        width: min(100%, 820px);
        background: var(--card);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 28px;
        border: 1px solid var(--border);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.6rem);
      }

      .theme-toggle {
        border: 1px solid var(--border);
        background: var(--card-alt);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
        font-weight: 700;
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
      }

      .todo-form {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
      }

      .todo-input,
      .todo-date {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card-alt);
        color: var(--text);
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .todo-input {
        flex: 1;
      }

      .todo-input:focus,
      .todo-date:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
      }

      .add-btn,
      .delete-btn,
      .toggle-btn,
      .edit-btn,
      .clear-btn,
      .filter-btn {
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
      }

      .add-btn {
        background: var(--primary);
        color: #fff;
        padding: 0 20px;
        font-weight: 700;
      }

      .add-btn:hover,
      .delete-btn:hover,
      .toggle-btn:hover,
      .edit-btn:hover,
      .clear-btn:hover,
      .filter-btn:hover {
        transform: translateY(-1px);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter-btn {
        background: rgba(79, 70, 229, 0.08);
        color: var(--primary-dark);
        padding: 8px 12px;
        font-weight: 600;
      }

      .filter-btn.active {
        background: var(--primary);
        color: #fff;
      }

      .clear-btn {
        background: rgba(239, 68, 68, 0.08);
        color: var(--danger);
        padding: 10px 14px;
        font-weight: 600;
      }

      .tasks {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .task {
        background: var(--card-alt);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: grab;
      }

      .task.dragging {
        opacity: 0.5;
      }

      .task-main {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
      }

      .task-text {
        flex: 1;
        word-break: break-word;
        line-height: 1.4;
      }

      .task.completed .task-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      .task-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .due-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        padding: 4px 8px;
        font-weight: 700;
        background: rgba(245, 158, 11, 0.12);
        color: var(--warning);
      }

      .task.completed .due-badge {
        background: rgba(16, 185, 129, 0.12);
        color: var(--success);
      }

      .toggle-btn {
        width: 40px;
        height: 40px;
        background: rgba(14, 165, 233, 0.15);
        color: #0284c7;
        font-weight: 700;
        font-size: 1rem;
      }

      .task.completed .toggle-btn {
        background: rgba(16, 185, 129, 0.15);
        color: #15803d;
      }

      .task-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .edit-btn {
        background: rgba(79, 70, 229, 0.10);
        color: var(--primary-dark);
        padding: 8px 10px;
        font-weight: 700;
      }

      .delete-btn {
        width: 38px;
        height: 38px;
        background: rgba(239, 68, 68, 0.10);
        color: var(--danger);
        font-weight: 700;
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        background: var(--card-alt);
        border: 1px dashed var(--border);
        border-radius: 16px;
        padding: 30px 16px;
      }

      @media (max-width: 640px) {
        .app { padding: 20px 16px; }
        .todo-form { flex-direction: column; }
        .add-btn { padding: 14px 16px; }
        .task { align-items: flex-start; }
        .task-actions { align-self: flex-end; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <h1>Todo List</h1>
        <button id="theme-toggle" class="theme-toggle" type="button">🌙 Dark</button>
      </div>

      <p class="subtitle">Track tasks, deadlines, and progress with local storage.</p>

      <form id="todo-form" class="todo-form">
        <input id="todo-input" class="todo-input" type="text" placeholder="Add a new task..." maxlength="200" aria-label="Add a new task" />
        <input id="todo-date" class="todo-date" type="date" aria-label="Due date" />
        <button type="submit" class="add-btn">Add</button>
      </form>

      <div class="toolbar">
        <div class="filters" aria-label="Task filters">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>

        <button id="clear-completed" class="clear-btn" type="button">Clear completed</button>
      </div>

      <ul id="task-list" class="tasks" aria-live="polite"></ul>
    </div>

    <script>
      const STORAGE_KEY = 'todo-list-items-v2';
      const THEME_KEY = 'todo-theme';

      const filters = {
        all: () => true,
        active: (task) => !task.completed,
        completed: (task) => task.completed,
      };

      const form = document.getElementById('todo-form');
      const input = document.getElementById('todo-input');
      const dateInput = document.getElementById('todo-date');
      const taskList = document.getElementById('task-list');
      const clearCompletedBtn = document.getElementById('clear-completed');
      const filterButtons = [...document.querySelectorAll('.filter-btn')];
      const themeToggleBtn = document.getElementById('theme-toggle');

      let tasks = loadTasks();
      let activeFilter = 'all';
      let dragIndex = null;

      function loadTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(saved) ? saved : [];
        } catch {
          return [];
        }
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function getTheme() {
        return localStorage.getItem(THEME_KEY) || 'light';
      }

      function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.body.classList.toggle('dark', isDark);
        themeToggleBtn.textContent = isDark ? '☀️ Light' : '🌙 Dark';
      }

      function formatDate(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString + 'T00:00:00');
        return new Intl.DateTimeFormat(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
        }).format(date);
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderTasks() {
        const visibleTasks = tasks.filter(filters[activeFilter] || filters.all);

        if (visibleTasks.length === 0) {
          taskList.innerHTML = `
            <li class="empty-state">
              ${tasks.length === 0 ? 'No tasks yet. Add one to get started!' : 'No tasks match the current filter.'}
            </li>
          `;
          return;
        }

        taskList.innerHTML = visibleTasks
          .map((task, index) => {
            const originalIndex = tasks.findIndex((item) => item.id === task.id);
            const dueText = task.dueDate ? `<span class="due-badge">📅 ${formatDate(task.dueDate)}</span>` : '';

            return `
              <li class="task ${task.completed ? 'completed' : ''}" data-id="${task.id}" draggable="true" data-index="${originalIndex}">
                <div class="task-main">
                  <button class="toggle-btn" type="button" aria-label="Toggle task status" data-action="toggle" data-id="${task.id}">
                    ${task.completed ? '✓' : ''}
                  </button>

                  <div class="task-text">
                    ${escapeHtml(task.text)}
                    <div class="task-meta">
                      ${dueText}
                      <span>Added ${formatDate(task.createdAt)}</span>
                    </div>
                  </div>
                </div>

                <div class="task-actions">
                  <button class="edit-btn" type="button" data-action="edit" data-id="${task.id}">Edit</button>
                  <button class="delete-btn" type="button" aria-label="Delete task" data-action="delete" data-id="${task.id}">×</button>
                </div>
              </li>
            `;
          })
          .join('');

        bindDragAndDrop();
      }

      function bindDragAndDrop() {
        const items = [...document.querySelectorAll('.task')];

        items.forEach((item) => {
          item.addEventListener('dragstart', (event) => {
            dragIndex = Number(item.dataset.index);
            item.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
          });

          item.addEventListener('dragend', () => {
            item.classList.remove('dragging');
            dragIndex = null;
          });

          item.addEventListener('dragover', (event) => {
            event.preventDefault();
          });

          item.addEventListener('drop', (event) => {
            event.preventDefault();
            const targetIndex = Number(item.dataset.index);
            if (dragIndex === null || dragIndex === targetIndex) return;

            const dragged = tasks.splice(dragIndex, 1)[0];
            tasks.splice(targetIndex, 0, dragged);
            saveTasks();
            renderTasks();
          });
        });
      }

      function addTask(text, dueDate) {
        const trimmed = text.trim();
        if (!trimmed) {
          input.focus();
          return;
        }

        tasks.push({
          id: crypto.randomUUID(),
          text: trimmed,
          completed: false,
          createdAt: new Date().toISOString().slice(0, 10),
          dueDate: dueDate || '',
        });

        saveTasks();
        renderTasks();
        input.value = '';
        dateInput.value = '';
        input.focus();
      }

      function toggleTask(id) {
        tasks = tasks.map((task) =>
          task.id === id ? { ...task, completed: !task.completed } : task
        );
        saveTasks();
        renderTasks();
      }

      function editTask(id) {
        const task = tasks.find((item) => item.id === id);
        if (!task) return;

        const newText = window.prompt('Edit task', task.text);
        if (newText === null) return;

        const trimmed = newText.trim();
        if (!trimmed) return;

        task.text = trimmed;
        saveTasks();
        renderTasks();
      }

      function deleteTask(id) {
        tasks = tasks.filter((task) => task.id !== id);
        saveTasks();
        renderTasks();
      }

      function clearCompleted() {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        renderTasks();
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        addTask(input.value, dateInput.value);
      });

      taskList.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        const { action, id } = button.dataset;
        if (!id) return;

        if (action === 'toggle') toggleTask(id);
        if (action === 'edit') editTask(id);
        if (action === 'delete') deleteTask(id);
      });

      clearCompletedBtn.addEventListener('click', clearCompleted);

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          activeFilter = button.dataset.filter;
          filterButtons.forEach((btn) => btn.classList.toggle('active', btn === button));
          renderTasks();
        });
      });

      themeToggleBtn.addEventListener('click', () => {
        const nextTheme = getTheme() === 'dark' ? 'light' : 'dark';
        localStorage.setItem(THEME_KEY, nextTheme);
        applyTheme(nextTheme);
      });

      applyTheme(getTheme());
      renderTasks();
    </script>
  </body>
</html>
